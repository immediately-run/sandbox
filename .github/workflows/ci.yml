name: CI

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Setup | Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup | Install dependencies
        run: npm ci

      - name: Lint | Eslint Check
        run: npm run lint

      - name: Format | Prettier Check
        run: npm run format -- --check

      - name: Test | Verify types
        run: npm run typecheck

      - name: Test | Jest
        run: npm test -- --forceExit

      # R3-274a (PLATFORM_LAYERING_SPEC §2, Phase 1): freeze the wire vocabulary
      # this frame speaks to the host. `typecheck` and jest never see a renamed or
      # reshaped message name — the host and the SDK do, at runtime, in production.
      # Extracts from src/ with the TypeScript checker (most channel names here are
      # CONSTANTS, which only a checker resolves back to their literal), and runs
      # its own `--self-test`: a gate that finds zero names must fail, not pass.
      - name: Test | Protocol snapshot
        run: npm run protocol:check

      - name: Test | Protocol snapshot self-test
        run: npm run protocol:selftest

      # R3-274b: the wire vocabulary now has ONE definition
      # (scripts/protocol-codegen/descriptors.protocol.mjs) and four projections —
      # this frame's constants + types, this repo's snapshot, and both of the SDK's.
      # "DO NOT EDIT" in a generated header is a request; this is the mechanism:
      # regenerate and compare bytes, and prove the snapshots transcribe back to the
      # committed descriptors (generation and transcription must be inverses, or the
      # descriptors are a second copy that merely agrees today).
      - name: Test | Protocol codegen drift
        run: npm run protocol:codegen-drift

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Setup | Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup | Install dependencies
        run: npm ci

      - name: Build | Build application
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
