name: CI

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4
        with:
          # check:untested diffs this branch against its merge-base with
          # origin/main, so the base ref must exist; a default shallow checkout
          # fetches only the merge ref.
          fetch-depth: 0

      - name: Setup | Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # R3-327 check 1 — a pin to an unpublished @immediately-run/* version, and a
      # package.json/package-lock.json disagreement about it. Runs BEFORE `npm ci`,
      # deliberately: that is the command such a pin breaks, so afterwards the
      # informative message never appears — the run has already died on 40 lines of
      # `ETARGET` nobody reads, which is why the red check on sdk #112 read as noise
      # and merged anyway. `--self-test` runs first: a gate that cannot fail is not a
      # gate, and it replays sdk #112's real diff rather than a hypothetical.
      - name: Release | Dependency pins are published and lock-agreeing (R3-327)
        run: npm run check:pins
      # R3-869 — the manifest↔lock version sync.
      - run: npm run check:lock-version

      # R3-814 — the parity gate for this enumeration itself: every `verify` leg
      # either runs in this file or carries a `# verify-parity-exempt:` line with a
      # reason. Pre-install, deliberately: it reads only package.json and this file,
      # so it fails fast on the diff that added a leg without CI coverage.
      - name: Release | CI covers every verify leg (R3-814)
        run: npm run check:verify-parity

      - name: Setup | Install dependencies
        run: npm ci

      # R3-814 — the five legs this job used to omit (a PR could be green here while
      # `npm run verify` was red on the branch). One grouped step, not five new
      # checkout taxes (the site-main R3-641 pattern).
      - name: Verify | clones / unused / untested / lockfile-installable / dist-documents selftest
        run: |
          npm run check:lockfile-installable
          npm run check:clones
          npm run check:unused
          npm run check:comment-refs
          npm run check:untested
          npm run check:dist-documents:selftest

      # R3-838 — the committed embeddedToolchainHash.ts must equal the hash of
      # the INSTALLED transpiler pin: jest and `npm run dev` read the committed
      # copy, and the build job's prebuild regenerates (and thereby masks) any
      # drift, so this gate runs here — after install, where the pin exists, and
      # never after a build. Self-test first: a gate that cannot fail is not one.
      - name: Test | Toolchain hash committed == installed (R3-838)
        run: npm run check:toolchain-hash

      - name: Lint | Eslint Check
        run: npm run lint

      # `npm run format -- --check` appended --check to a `prettier --write` script:
      # it REWROTE the tree and exited 0, so this step could never fail and 106 files
      # drifted unnoticed. `format:check` is a real --check.
      - name: Format | Prettier Check
        run: npm run format:check
      - run: npm run check:format-staged

      - name: Test | Verify types
        run: npm run typecheck

      - name: Test | Jest
        run: npm test -- --forceExit

      # R3-274a (PLATFORM_LAYERING_SPEC §2, Phase 1): freeze the wire vocabulary
      # this frame speaks to the host. `typecheck` and jest never see a renamed or
      # reshaped message name — the host and the SDK do, at runtime, in production.
      # Extracts from src/ with the TypeScript checker (most channel names here are
      # CONSTANTS, which only a checker resolves back to their literal), and runs
      # its own `--self-test`: a gate that finds zero names must fail, not pass.
      - name: Test | Protocol snapshot
        run: npm run protocol:check

      - name: Test | Protocol snapshot self-test
        run: npm run protocol:selftest

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Setup | Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup | Install dependencies
        run: npm ci

      - name: Build | Build application
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
