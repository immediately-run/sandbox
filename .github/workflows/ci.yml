name: CI

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4
        with:
          # check:untested diffs this branch against its merge-base with
          # origin/main, so the base ref must exist; a default shallow checkout
          # fetches only the merge ref.
          fetch-depth: 0

      - name: Setup | Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # R3-327 check 1 — a pin to an unpublished @immediately-run/* version, and a
      # package.json/package-lock.json disagreement about it. Runs BEFORE `npm ci`,
      # deliberately: that is the command such a pin breaks, so afterwards the
      # informative message never appears — the run has already died on 40 lines of
      # `ETARGET` nobody reads, which is why the red check on sdk #112 read as noise
      # and merged anyway. `--self-test` runs first: a gate that cannot fail is not a
      # gate, and it replays sdk #112's real diff rather than a hypothetical.
      - name: Release | Dependency pins are published and lock-agreeing (R3-327)
        run: npm run check:pins

      - name: Setup | Install dependencies
        run: npm ci

      - name: Lint | Eslint Check
        run: npm run lint

      # `npm run format -- --check` appended --check to a `prettier --write` script:
      # it REWROTE the tree and exited 0, so this step could never fail and 106 files
      # drifted unnoticed. `format:check` is a real --check.
      - name: Format | Prettier Check
        run: npm run format:check

      - name: Test | Verify types
        run: npm run typecheck

      - name: Test | Jest
        run: npm test -- --forceExit

      # R3-274a (PLATFORM_LAYERING_SPEC §2, Phase 1): freeze the wire vocabulary
      # this frame speaks to the host. `typecheck` and jest never see a renamed or
      # reshaped message name — the host and the SDK do, at runtime, in production.
      # Extracts from src/ with the TypeScript checker (most channel names here are
      # CONSTANTS, which only a checker resolves back to their literal), and runs
      # its own `--self-test`: a gate that finds zero names must fail, not pass.
      - name: Test | Protocol snapshot
        run: npm run protocol:check

      - name: Test | Protocol snapshot self-test
        run: npm run protocol:selftest


  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v4

      - name: Setup | Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup | Install dependencies
        run: npm ci

      - name: Build | Build application
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
