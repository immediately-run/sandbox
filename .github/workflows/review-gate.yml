# review-gate (R3-1166) — the deterministic gate verdict as a required check.
#
# Base-branch workflow by design: `pull_request_target` runs THIS repo's copy, never the
# PR's. The job checks out nothing from the PR, reads reviews and threads by GraphQL, and
# writes the `review-gate` check run on the PR's head SHA. `wait` maps to in_progress, so
# a PR with no review on its current head reads as pending, never as green.

name: review-gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
        type: number

permissions:
  checks: write
  pull-requests: read

jobs:
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Compute and post the review-gate verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          REPO_NAME: ${{ github.event.repository.name }}
        # The pinned package, not the PR: the verdict rule is code the PR cannot edit.
        run: npm exec --yes --package @immediately-run/verify-checks@0.9.0 -- review-gate "$GITHUB_REPOSITORY_OWNER" "$REPO_NAME" "$PR_NUMBER"
